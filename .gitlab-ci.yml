stages:
  - test
  - publish

image: rust:latest

test:
  stage: test
  script:
    - cargo build
    - cargo test

publish:
  stage: publish
  script:
    - |
      for f in Cargo.toml clap-serde-proc/Cargo.toml
      do
        sed -i 's/\[package\]/\0\nversion = "'"${CI_COMMIT_TAG#v}"'"/' "$f"
      done
    - cargo publish -p clap-serde-proc
    - sleep 30 # await cargo index to update
    - cargo publish
  only:
    refs: [tags]
